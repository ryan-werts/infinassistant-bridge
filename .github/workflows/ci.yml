name: CI

# Build, unit tests and the golden-vector pin check. Runs on push and on pull requests, including
# pull requests from forks, so it must never read a secret: there are none here, and the trigger is
# the plain pull_request event, which gives forks no secrets. The signed release build is in release.yml, on version tags only.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

  golden-vectors:
    name: Golden vectors match the pinned firmware tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the vendored copy with the firmware repository at the pinned tag
        shell: bash
        run: |
          set -euo pipefail
          pin=core-data/src/test/resources/golden-vectors.pin
          copy=core-data/src/test/resources/golden-vectors/protocol-vectors.json
          tag=$(sed -n 's/^tag=//p' "$pin")
          want=$(sed -n 's/^sha256=//p' "$pin")
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$pin must hold a line tag=<major.minor.patch>"
            exit 1
          fi
          if ! printf '%s' "$want" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::$pin must hold a line sha256=<64 hex digits>"
            exit 1
          fi
          have=$(sha256sum "$copy" | cut -d' ' -f1)
          if [ "$have" != "$want" ]; then
            echo "::error::$copy does not match the sha256 pinned in $pin"
            exit 1
          fi
          url="https://raw.githubusercontent.com/ryan-werts/infinassistant-firmware/${tag}/infinassistant/vectors/protocol-vectors.json"
          upstream="$RUNNER_TEMP/upstream-protocol-vectors.json"
          if ! curl -fsSL --retry 2 -o "$upstream" "$url"; then
            echo "::error::Cannot fetch the golden vectors at firmware tag $tag from $url. Either the tag does not exist or the firmware repository is not public yet."
            exit 1
          fi
          if ! cmp -s "$upstream" "$copy"; then
            echo "::error::$copy differs from the vectors at firmware tag $tag. Copy the file from that tag, or point $pin at the tag the copy belongs to."
            exit 1
          fi
          echo "$copy is byte-identical to the vectors at firmware tag $tag"
